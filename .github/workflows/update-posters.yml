name: Update event posters

on:
  push:
    paths:
      - "Posters/**"
      - ".github/workflows/update-posters.yml"
      - "scripts/build_posters.py"
  schedule:
    - cron: "0 16 * * *" # Midnight in Malaysia (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kuala_Lumpur
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          python -m pip install pillow pytesseract
      - name: Read poster dates and build active poster list
        run: python scripts/build_posters.py
      - name: Commit poster list when changed
        run: |
          if git diff --quiet -- posters.json; then
            echo "Poster list is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posters.json
          git commit -m "Automatically update active event posters"
          git push
